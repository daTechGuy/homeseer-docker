name: Build & Publish Images

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'unraid/**']
  pull_request:
    paths-ignore: ['**.md', 'unraid/**']
  # rebuild weekly to pick up Debian security updates
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve HomeSeer version
        id: version
        run: |
          source versions.env
          if [ "${{ matrix.channel }}" = "latest" ]; then VERSION=$RELEASE_VERSION; else VERSION=$BETA_VERSION; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "download=https://homeseer.com/updates4/linux_${VERSION//./_}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "builddate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homeseer" >> "$GITHUB_OUTPUT"

      # download once on the runner (with retries) instead of inside the per-platform build
      - name: Download HomeSeer archive
        run: |
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 600 \
               -o downloads/homeseer.tar.gz "${{ steps.version.outputs.download }}"
          gzip -t downloads/homeseer.tar.gz
          ls -la downloads

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            DOWNLOAD=${{ steps.version.outputs.download }}
            BUILDDATE=${{ steps.version.outputs.builddate }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ matrix.channel }}
          cache-from: type=gha,scope=${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}
